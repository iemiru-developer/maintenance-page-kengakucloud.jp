  <meta name="robots" content="noindex, nofollow">
  <title>メンテナンス中 | ケンガククラウド</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      color: #333333;
      background: #F4F3F2;
      font-family: "Noto Sans JP", sans-serif;
      font-weight: 400;
      font-size: 16px;
      line-height: 2;
      letter-spacing: 0.06em;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .page {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 18vh 8vw 8vh 13vw;
    }

    .logo {
      display: block;
      width: min(206px, 58vw);
      height: auto;
      margin-bottom: 48px;
    }

    .title {
      position: relative;
    }

    .title__en {
      display: block;
      color: #E8E6E2;
      font-family: "Jost", sans-serif;
      font-size: clamp(48px, 8vw, 110px);
      font-weight: 600;
      line-height: 1;
      letter-spacing: 0.02em;
      text-transform: capitalize;
    }

    .title__jp {
      display: block;
      margin-top: -0.55em;
      color: #333333;
      font-family: "Noto Sans JP", sans-serif;
      font-size: clamp(24px, 3vw, 32px);
      font-weight: 500;
      line-height: 1.45;
      letter-spacing: 0.06em;
    }

    .lead {
      max-width: 28em;
      margin-top: 32px;
      color: #4B4B4B;
      font-size: 16px;
      font-weight: 400;
      line-height: 2;
      letter-spacing: 0.06em;
    }

    .copyright {
      margin-top: 64px;
      color: #C7C1B5;
      font-family: "Jost", sans-serif;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.04em;
      line-height: 1;
    }

    @media (max-width: 767px) {
      .page {
        justify-content: flex-start;
        padding: 108px 24px 48px;
      }

      .logo {
        width: 168px;
        margin-bottom: 40px;
      }

      .title__en {
        font-size: 48px;
      }

      .title__jp {
        margin-top: -0.7em;
        font-size: 22px;
      }

      .lead {
        margin-top: 24px;
        font-size: 14px;
        line-height: 1.9;
      }

      .copyright {
        margin-top: 48px;
        font-size: 12px;
      }
    }
  </style>
</head>
